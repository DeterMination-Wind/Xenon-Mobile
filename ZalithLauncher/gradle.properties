# launcher name & url
launcher_name=XenonMobile
launcher_app_name=Xenon Mobile
launcher_short_name=Xenon
url_home=https://github.com/DeterMination-Wind/Xenon-Mobile

# Primary Xenon mirror base used for the Mindustry catalog, artifacts and server lists.
# It defaults to the mirror's direct IP because the mindustry.men domains answer the hosting
# provider's ICP filing rejection page; the app allows cleartext HTTP so the IP endpoint works.
# The mirror stays the first source and GitHub is only the last-resort fallback.
# Uncomment to use a different deployment:
#mindustry_mirror=http://192.168.1.10:8080/github

# your OAuth client id
#oauth_client_id=xxx

# your CurseForge API key
#curseforge_api_key=xxx

# Debug signing credentials are read from DEBUG_STORE_PASSWORD and
# DEBUG_KEY_PASSWORD, or from ignored .store_password.txt/.key_password.txt.

# launcher version
launcher_version_code=200028
launcher_version_name=2.4.6
